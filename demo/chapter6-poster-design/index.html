<!DOCTYPE html>
<html lang="zh-CN" data-ipw-template="bookclub-saturday-human-history" data-ipw-style="warm"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="周六社区读书会 ·《人类简史》共读">
<title>周六社区读书会 ·《人类简史》共读</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&amp;family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Noto+Serif+SC:wght@600;700;900&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-tokens.css" data-ipw-design-tokens="">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #46352a;
    color: var(--ipw-color-text);
    font-family: var(--ipw-font-body);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- 海报主体：1080 × 1440 竖版，摊开的旧书 ---------- */
  .poster {
    position: relative;
    width: 1080px;
    max-width: 96vw;
    aspect-ratio: 3 / 4;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 76px 84px 56px;
    background: radial-gradient(120% 92% at 50% 38%, #fbf4e6 0%, var(--ipw-color-bg) 55%, #ecdfc5 100%);
    box-shadow:
      inset 0 0 130px 34px rgba(140, 90, 59, 0.16),
      0 48px 110px -24px rgba(30, 18, 6, 0.65);
  }

  /* 纸张颗粒质感（旧书页噪点） */
  .poster::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background-image:
      radial-gradient(rgba(130, 95, 45, .14) 1px, transparent 1.4px),
      radial-gradient(rgba(255, 250, 240, .5) 1px, transparent 1.4px);
    background-size: 6px 6px, 9px 9px;
    background-position: 0 0, 4px 4px;
  }

  /* 中央书缝：摊开的旧书左右两页的中缝 */
  .seam {
    position: absolute; left: 50%; top: 0; bottom: 0; width: 90px;
    transform: translateX(-50%);
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(62, 90, 73, .09) 44%,
      rgba(62, 90, 73, .16) 50%,
      rgba(62, 90, 73, .09) 56%,
      transparent 100%);
    pointer-events: none;
  }
  .seam::after {
    content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1.5px;
    transform: translateX(-50%);
    background: rgba(62, 90, 73, .3);
    box-shadow: 0 0 14px 3px rgba(62, 90, 73, .14);
  }

  /* 书封式双线边框 */
  .frame { position: absolute; inset: 22px; border: 1.5px solid color-mix(in srgb, var(--ipw-color-primary) 72%, transparent); pointer-events: none; opacity: .85; }
  .frame::after { content: ""; position: absolute; inset: 7px; border: 1px solid var(--ipw-color-border); }

  /* ---------- 顶层：引题 + 印章角标 ---------- */
  .top { position: relative; display: flex; align-items: center; justify-content: space-between; z-index: 1; }
  .eyebrow {
    display: flex; align-items: center; gap: 16px;
    font-family: var(--ipw-font-brush);
    font-size: 30px; color: var(--ipw-color-secondary); letter-spacing: .18em;
  }
  .eyebrow::before { content: ""; width: 46px; height: 2px; background: var(--ipw-color-accent); }
  .seal {
    flex: none; width: 62px; height: 62px; border-radius: 12px;
    display: grid; place-items: center;
    background: var(--ipw-color-primary);
    border: 1px solid var(--ipw-color-accent);
    transform: rotate(-6deg);
    box-shadow: 0 10px 24px -10px color-mix(in srgb, var(--ipw-color-primary) 60%, transparent);
  }
  .seal span { font-family: var(--ipw-font-brush); font-size: 38px; line-height: 1; color: var(--ipw-color-bg); }

  /* ---------- 主标题区 ---------- */
  .hero { position: relative; text-align: center; margin: 30px 0 10px; z-index: 1; }
  h1 { margin: 0; font-family: var(--ipw-font-display); font-weight: 900; }
  .hero .line { display: block; font-size: 92px; line-height: 1.2; letter-spacing: .14em; color: var(--ipw-color-text); }
  .hero .brush {
    display: inline-block; margin-top: 6px;
    font-family: var(--ipw-font-brush); font-weight: 400;
    font-size: 150px; line-height: 1.08; letter-spacing: .06em;
    color: var(--ipw-color-primary);
    text-shadow: 0 12px 34px color-mix(in srgb, var(--ipw-color-primary) 28%, transparent);
  }

  /* ---------- 书目区：书名 / 作者 / 推荐语 ---------- */
  .book { position: relative; text-align: center; margin: 26px 0 24px; z-index: 1; }
  .book-title { margin: 0; font-size: 100px; font-weight: 900; line-height: 1.2; letter-spacing: .08em; color: var(--ipw-color-text); }
  .rule { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 20px auto 18px; }
  .rule i { width: 110px; height: 1.5px; background: linear-gradient(90deg, transparent, var(--ipw-color-accent)); }
  .rule i:last-child { transform: scaleX(-1); }
  .rule b { font-size: 13px; color: var(--ipw-color-accent); transform: rotate(45deg); }
  .author { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: .34em; color: var(--ipw-color-secondary); }
  .blurb { margin: 22px auto 0; max-width: 780px; font-size: 26px; line-height: 1.9; letter-spacing: .1em; color: var(--ipw-color-muted); }

  /* ---------- 信息区：时间 / 地点 ---------- */
  .info { position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px; margin: 26px 0 30px; z-index: 1; }
  .row { display: flex; align-items: center; gap: 20px; }
  .ic {
    flex: none; width: 56px; height: 56px; border-radius: 14px;
    display: grid; place-items: center; font-size: 26px;
    background: var(--ipw-color-surface);
    border: 1px solid var(--ipw-color-border);
  }
  .row .label { width: 72px; flex: none; font-size: 20px; font-weight: 900; letter-spacing: .22em; color: var(--ipw-color-secondary); }
  .row .value { font-size: 28px; font-weight: 500; color: var(--ipw-color-text); letter-spacing: .05em; }

  /* ---------- 报名书签块（最醒目） ---------- */
  .signup {
    position: relative; z-index: 1; align-self: center;
    display: flex; align-items: center; gap: 22px;
    padding: 30px 46px;
    background: linear-gradient(135deg, var(--ipw-color-primary), color-mix(in srgb, var(--ipw-color-primary) 72%, #16241c));
    border: 2px solid var(--ipw-color-accent);
    border-radius: var(--ipw-card-radius);
    box-shadow:
      0 0 0 5px color-mix(in srgb, var(--ipw-color-accent) 28%, transparent),
      0 18px 44px -12px color-mix(in srgb, var(--ipw-color-primary) 65%, transparent);
  }
  /* 书签形底部凹口 */
  .signup::after {
    content: ""; position: absolute; left: 50%; bottom: -1.5px; transform: translateX(-50%);
    width: 30px; height: 16px;
    background: var(--ipw-color-bg);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
  }
  .sig-label { font-family: var(--ipw-font-brush); font-size: 40px; color: var(--ipw-color-accent); letter-spacing: .08em; white-space: nowrap; }
  .sig-dot { font-size: 14px; color: var(--ipw-color-accent); }
  .sig-value { font-size: 36px; font-weight: 900; letter-spacing: .12em; color: var(--ipw-color-bg); }

  /* ---------- 落款 ---------- */
  .foot { position: relative; display: flex; align-items: center; justify-content: space-between; margin-top: auto; z-index: 1; }
  .foot span { font-size: 21px; color: var(--ipw-color-muted); letter-spacing: .12em; }
  .foot span:first-child { font-family: var(--ipw-font-display); font-weight: 700; color: var(--ipw-color-secondary); }

  @media (max-width: 640px) {
    body { padding: 10px; }
    .poster { padding: 40px 28px 32px; }
    .hero .line { font-size: 52px; } .hero .brush { font-size: 88px; }
    .book-title { font-size: 58px; } .author { font-size: 20px; } .blurb { font-size: 18px; }
    .row .value { font-size: 19px; }
    .signup { padding: 20px 22px; gap: 14px; }
    .sig-label { font-size: 26px; } .sig-value { font-size: 22px; }
  }
</style>
</head>
