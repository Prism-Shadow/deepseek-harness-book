<svg xmlns="http://www.w3.org/2000/svg" width="734" height="213" viewBox="28 83 734 213" role="img" aria-labelledby="title">
<title id="title">资源创建与清理</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" /></marker></defs>
<rect width="800" height="340" fill="white" />
<g font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif" fill="#172b4d">
<text x="40" y="135" font-size="21" font-weight="700">加载时</text>
<rect x="150" y="95" width="265" height="64" rx="12" fill="#eff6ff" stroke="#93b7e8" stroke-width="1.5" />
<text x="282.5" y="135" text-anchor="middle" font-size="22">创建定时器</text>
<rect x="475" y="95" width="275" height="64" rx="12" fill="#eff6ff" stroke="#93b7e8" stroke-width="1.5" />
<text x="612.5" y="135" text-anchor="middle" font-size="22">保存清理函数</text>
<path d="M417 127 L471 127" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<text x="40" y="260" font-size="21" font-weight="700">卸载时</text>
<rect x="150" y="220" width="265" height="64" rx="12" fill="#eff6ff" stroke="#93b7e8" stroke-width="1.5" />
<text x="282.5" y="260" text-anchor="middle" font-size="22">调用清理函数</text>
<rect x="475" y="220" width="275" height="64" rx="12" fill="#eff6ff" stroke="#93b7e8" stroke-width="1.5" />
<text x="612.5" y="260" text-anchor="middle" font-size="22">停止定时器</text>
<path d="M417 252 L471 252" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
</g>
</svg>
