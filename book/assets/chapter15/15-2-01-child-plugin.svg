<svg xmlns="http://www.w3.org/2000/svg" width="644" height="288" viewBox="78 76 644 288" role="img" aria-labelledby="title">
<title id="title">外层插件与子插件</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" /></marker></defs>
<rect width="800" height="440" fill="white" />
<g font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif" fill="#172b4d">
<rect x="90" y="88" width="620" height="64" rx="12" fill="#eff6ff" stroke="#93b7e8" stroke-width="1.5" />
<text x="400.0" y="128" text-anchor="middle" font-size="22">外层插件 apply 开始执行</text>
<path d="M400 153 L400 184" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<rect x="90" y="188" width="620" height="64" rx="12" fill="#eff6ff" stroke="#93b7e8" stroke-width="1.5" />
<text x="400.0" y="228" text-anchor="middle" font-size="22">ctx.plugin(heartbeat) 启动子插件</text>
<path d="M400 253 L400 284" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<rect x="90" y="288" width="620" height="64" rx="12" fill="#eff6ff" stroke="#93b7e8" stroke-width="1.5" />
<text x="400.0" y="328" text-anchor="middle" font-size="22">heartbeat 每隔 200 毫秒打印 tick</text>
</g>
</svg>
