<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">能力接缝 seam</title><desc id="desc">消费者只依赖服务定义，同一接口后可以替换本地、沙箱、远程或其他产品实现。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#315EF5"/></marker><style>.zh{font-family:SimSun,"Songti SC",serif}.mix{font-family:"Times New Roman",SimSun,"Songti SC",serif}.t{font-size:50px;font-weight:700;fill:#273142}.sub{font-size:25px;fill:#5c667a}.h{font-size:29px;font-weight:700;fill:#273142}.p{font-size:22px;fill:#526071}.ih{font-size:29px;font-weight:700;fill:#fff}.ip{font-size:22px;fill:#fff}.line{stroke:#315EF5;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="900" fill="#fff"/><text x="100" y="92" class="mix t">Seam：换提供方，不改消费者</text><text x="100" y="137" class="zh sub">一项可替换能力 = 接口定义 + 提供方 + 消费方</text>
  <rect x="100" y="320" width="310" height="220" rx="26" fill="#F3F4F6" stroke="#9AA7B8" stroke-width="3"/><text x="255" y="385" text-anchor="middle" class="mix h">Consumer</text><text x="255" y="434" text-anchor="middle" class="mix p">tool-bash</text><text x="255" y="478" text-anchor="middle" class="zh p">只认接口</text><path d="M410 430H550" class="line"/>
  <rect x="560" y="295" width="380" height="270" rx="26" fill="#315EF5"/><text x="750" y="370" text-anchor="middle" class="mix ih">Service Definition</text><text x="750" y="425" text-anchor="middle" class="mix ip">ctx.shell / ctx.subagents</text><text x="750" y="475" text-anchor="middle" class="zh ip">屏蔽实现细节</text><path d="M940 430H1050" class="line"/>
  <rect x="1060" y="210" width="440" height="125" rx="22" fill="#EEF2FF" stroke="#315EF5" stroke-width="3"/><text x="1280" y="264" text-anchor="middle" class="mix h">Local / In-process</text><text x="1280" y="302" text-anchor="middle" class="zh p">本机执行或进程内子 Agent</text>
  <rect x="1060" y="365" width="440" height="125" rx="22" fill="#F3F4F6" stroke="#9AA7B8" stroke-width="3"/><text x="1280" y="419" text-anchor="middle" class="mix h">Sandbox / Remote</text><text x="1280" y="457" text-anchor="middle" class="zh p">沙箱、远程执行世界</text>
  <rect x="1060" y="520" width="440" height="125" rx="22" fill="#F3F4F6" stroke="#9AA7B8" stroke-width="3"/><text x="1280" y="574" text-anchor="middle" class="mix h">Codex / Claude Code / ACP</text><text x="1280" y="612" text-anchor="middle" class="zh p">外部产品也能成为提供方</text>
  <rect x="100" y="730" width="1400" height="92" rx="20" fill="#EEF2FF"/><text x="800" y="787" text-anchor="middle" class="zh h">典型场景：替换模型、沙箱、文件系统、存储、子 Agent 和执行后端</text>
</svg>
