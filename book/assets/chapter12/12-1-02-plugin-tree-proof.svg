<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">真实配置树中的 agent loop 与 todo 工具</title><desc id="desc">根据实际运行 dsh --profile web --dump-config 得到的配置片段，两类能力拥有相同配置形状。</desc>
  <defs><style>
    .mix{font-family:"Times New Roman",SimSun,"Songti SC",serif}.mono{font-family:"SFMono-Regular",Menlo,Consolas,monospace}.zh{font-family:SimSun,"Songti SC",serif}
    .t{font-size:48px;font-weight:700;fill:#273142}.sub{font-size:24px;fill:#5c667a}.bar{font-size:22px;fill:#D9E1F2}.code{font-size:28px;fill:#E8EDF7}.blue{fill:#7FB3FF}.green{fill:#8BD49C}.note{font-size:25px;fill:#273142}
  </style></defs>
  <rect width="1600" height="900" fill="#fff"/><text x="100" y="88" class="mix t">亲手验证：大能力与小工具是同一种配置</text><text x="100" y="132" class="zh sub">真实执行：dsh --profile web --dump-config</text>
  <rect x="100" y="190" width="1400" height="510" rx="24" fill="#18202D"/>
  <circle cx="140" cy="226" r="10" fill="#FF6B6B"/><circle cx="174" cy="226" r="10" fill="#FFD166"/><circle cx="208" cy="226" r="10" fill="#65D38E"/>
  <text x="800" y="235" text-anchor="middle" class="mono bar">dsh config dump · sanitized</text>
  <text x="150" y="305" class="mono code">- id: <tspan class="blue">agent-loop</tspan></text><text x="190" y="350" class="mono code">name: <tspan class="green">'@deepseek-ai/dsh-agent-loop'</tspan></text><text x="190" y="395" class="mono code">config:</text><text x="230" y="440" class="mono code">agents: []</text>
  <line x1="780" y1="275" x2="780" y2="630" stroke="#3A4658" stroke-width="3"/>
  <text x="840" y="305" class="mono code">- id: <tspan class="blue">tool-todo</tspan></text><text x="880" y="350" class="mono code">name: <tspan class="green">'@deepseek-ai/dsh-tool-todo'</tspan></text><text x="880" y="395" class="mono code">config:</text><text x="920" y="440" class="mono code">allowParallelInProgress: true</text><text x="880" y="485" class="mono code">disabled: true</text>
  <rect x="145" y="555" width="560" height="88" rx="16" fill="#243045"/><text x="425" y="610" text-anchor="middle" class="zh bar">驱动整个 Agent 循环</text>
  <rect x="855" y="555" width="560" height="88" rx="16" fill="#243045"/><text x="1135" y="610" text-anchor="middle" class="zh bar">维护一张待办列表</text>
  <rect x="100" y="752" width="1400" height="82" rx="18" fill="#EEF2FF"/><text x="800" y="805" text-anchor="middle" class="zh note">结论：职责大小不同，装配地位相同；都能被禁用、替换或重组。</text>
</svg>
