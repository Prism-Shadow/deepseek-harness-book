<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cordis 解决什么以及边界</title><desc id="desc">传统方案使用进程重启处理模块变化，Cordis 在模块粒度撤销和重解依赖，同时外部不可逆动作和恶意代码仍需补偿与沙箱。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#315EF5"/></marker><style>.zh{font-family:SimSun,"Songti SC",serif}.mix{font-family:"Times New Roman",SimSun,"Songti SC",serif}.t{font-size:50px;font-weight:700;fill:#273142}.sub{font-size:25px;fill:#5c667a}.h{font-size:30px;font-weight:700;fill:#273142}.p{font-size:23px;fill:#526071}.ih{font-size:30px;font-weight:700;fill:#fff}.ip{font-size:23px;fill:#fff}.line{stroke:#315EF5;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="900" fill="#fff"/><text x="100" y="92" class="mix t">从“整机重启”到“模块级恢复”</text><text x="100" y="137" class="zh sub">Cordis 缩小生命周期治理的粒度，但没有消灭系统边界</text>
  <rect x="100" y="210" width="580" height="410" rx="28" fill="#F3F4F6" stroke="#9AA7B8" stroke-width="3"/><text x="145" y="275" class="zh h">传统粗粒度方案</text><rect x="160" y="345" width="460" height="105" rx="20" fill="#fff" stroke="#9AA7B8" stroke-width="3"/><text x="390" y="410" text-anchor="middle" class="zh h">插件出错 → 重启进程</text><text x="145" y="520" class="zh p">丢缓存、连接、局部计算与在途任务</text><text x="145" y="565" class="zh p">为高可用引入副本与跨进程通信</text>
  <path d="M680 415H900" class="line"/><text x="790" y="382" text-anchor="middle" class="zh p">粒度下沉</text>
  <rect x="920" y="210" width="580" height="410" rx="28" fill="#315EF5"/><text x="965" y="275" class="zh ih">Cordis 模块级方案</text><rect x="980" y="345" width="460" height="105" rx="20" fill="#EEF2FF"/><text x="1210" y="410" text-anchor="middle" class="zh h">卸载组件 → 撤销 + 重解依赖</text><text x="965" y="520" class="zh ip">保留其他组件的状态与连接</text><text x="965" y="565" class="zh ip">只重启真正受依赖变化影响的组件</text>
  <rect x="100" y="685" width="665" height="125" rx="22" fill="#EEF2FF" stroke="#315EF5" stroke-width="3"/><text x="140" y="733" class="zh h">适用</text><text x="140" y="778" class="zh p">工具注册、监听器、服务、缓存、路由、提供方切换</text>
  <rect x="835" y="685" width="665" height="125" rx="22" fill="#F3F4F6" stroke="#9AA7B8" stroke-width="3"/><text x="875" y="733" class="zh h">仍需别的机制</text><text x="875" y="778" class="zh p">外部写入用补偿/提交；恶意代码用进程、Wasm 或 VM 沙箱</text>
</svg>
