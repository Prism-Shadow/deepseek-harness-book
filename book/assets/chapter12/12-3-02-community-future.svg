<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">社区判断与 Cordis 的未来</title><desc id="desc">X 社区的正向和谨慎观点，以及从 Koishi 生产验证到 DSH 开发者预览再到自演化 harness 验证的路线。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#315EF5"/></marker><style>.zh{font-family:SimSun,"Songti SC",serif}.mix{font-family:"Times New Roman",SimSun,"Songti SC",serif}.t{font-size:50px;font-weight:700;fill:#273142}.sub{font-size:25px;fill:#5c667a}.h{font-size:28px;font-weight:700;fill:#273142}.p{font-size:22px;fill:#526071}.ih{font-size:28px;font-weight:700;fill:#fff}.ip{font-size:22px;fill:#fff}.tag{font-size:21px;font-weight:700;fill:#315EF5}.line{stroke:#315EF5;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="900" fill="#fff"/><text x="100" y="92" class="mix t">未来：从“可插拔”走向“可验证的自我改造”</text><text x="100" y="137" class="zh sub">公开讨论最关心的，不是插件数量，而是它能否安全地改自己</text>
  <rect x="100" y="205" width="430" height="230" rx="24" fill="#EEF2FF" stroke="#315EF5" stroke-width="3"/><text x="140" y="252" class="mix tag">X · @mitsuhiko</text><text x="140" y="302" class="zh h">架构值得重新思考</text><text x="140" y="351" class="zh p">开源让其他 harness 作者</text><text x="140" y="391" class="zh p">能检视并重做自己的选择</text>
  <rect x="585" y="205" width="430" height="230" rx="24" fill="#F3F4F6" stroke="#9AA7B8" stroke-width="3"/><text x="625" y="252" class="mix tag">X · early testers</text><text x="625" y="302" class="zh h">自修改已经可见</text><text x="625" y="351" class="zh p">Creator 模式能生成并挂载插件</text><text x="625" y="391" class="zh p">但运行时实验默认不持久化</text>
  <rect x="1070" y="205" width="430" height="230" rx="24" fill="#F3F4F6" stroke="#9AA7B8" stroke-width="3"/><text x="1110" y="252" class="mix tag">X · cautious view</text><text x="1110" y="302" class="zh h">产品化仍有距离</text><text x="1110" y="351" class="zh p">Node.js 门槛、兼容性、界面</text><text x="1110" y="391" class="zh p">与安全治理还需要迭代</text>
  <text x="100" y="520" class="zh h">证据与下一步</text>
  <rect x="100" y="585" width="360" height="150" rx="22" fill="#F3F4F6" stroke="#9AA7B8" stroke-width="3"/><text x="280" y="640" text-anchor="middle" class="mix h">Koishi</text><text x="280" y="681" text-anchor="middle" class="zh p">4000+ 社区插件</text><text x="280" y="714" text-anchor="middle" class="zh p">证明“能用”</text><path d="M460 660H610" class="line"/>
  <rect x="620" y="585" width="360" height="150" rx="22" fill="#315EF5"/><text x="800" y="640" text-anchor="middle" class="mix ih">dsh · Preview</text><text x="800" y="681" text-anchor="middle" class="zh ip">Cordis v4 进入 Agent harness</text><text x="800" y="714" text-anchor="middle" class="zh ip">正在快速迭代</text><path d="M980 660H1130" class="line"/>
  <rect x="1140" y="585" width="360" height="150" rx="22" fill="#EEF2FF" stroke="#315EF5" stroke-width="3"/><text x="1320" y="640" text-anchor="middle" class="zh h">自演化验证</text><text x="1320" y="681" text-anchor="middle" class="zh p">高频生成、替换、回滚</text><text x="1320" y="714" text-anchor="middle" class="zh p">证明“可持续安全”</text>
  <rect x="100" y="785" width="1400" height="70" rx="18" fill="#EEF2FF"/><text x="800" y="830" text-anchor="middle" class="zh p">开放问题：外部副作用、恶意插件隔离、依赖版本兼容、运行时成本、长期自演化治理</text>
</svg>
