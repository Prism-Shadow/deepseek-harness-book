<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">dsh 配置的分层装配</title><desc id="desc">从空列表开始，依次叠加基础组合包、应用组合包、profile 补丁、home 补丁与命令行补丁。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#315EF5"/></marker><style>
    .zh{font-family:SimSun,"Songti SC",serif}.mix{font-family:"Times New Roman",SimSun,"Songti SC",serif}.t{font-size:50px;font-weight:700;fill:#273142}.sub{font-size:25px;fill:#5c667a}.h{font-size:29px;font-weight:700;fill:#273142}.p{font-size:22px;fill:#526071}.ih{font-size:29px;font-weight:700;fill:#fff}.ip{font-size:22px;fill:#fff}.line{stroke:#315EF5;stroke-width:4;marker-end:url(#a)}
  </style></defs>
  <rect width="1600" height="900" fill="#fff"/><text x="100" y="92" class="mix t">一棵插件树，来自逐层叠加</text><text x="100" y="137" class="zh sub">越靠后的 overlay 优先级越高</text>
  <g><rect x="80" y="310" width="230" height="170" rx="22" fill="#F3F4F6" stroke="#9AA7B8" stroke-width="3"/><text x="195" y="375" text-anchor="middle" class="zh h">空列表</text><text x="195" y="420" text-anchor="middle" class="zh p">从零开始</text></g><line x1="310" y1="395" x2="355" y2="395" class="line"/>
  <g><rect x="365" y="285" width="260" height="220" rx="22" fill="#EEF2FF" stroke="#315EF5" stroke-width="3"/><text x="495" y="350" text-anchor="middle" class="mix h">dsh-base</text><text x="495" y="393" text-anchor="middle" class="zh p">模型 · 工具 · 会话</text><text x="495" y="432" text-anchor="middle" class="zh p">沙箱 · 存储</text></g><line x1="625" y1="395" x2="670" y2="395" class="line"/>
  <g><rect x="680" y="285" width="260" height="220" rx="22" fill="#F3F4F6" stroke="#9AA7B8" stroke-width="3"/><text x="810" y="350" text-anchor="middle" class="mix h">dsh-web-app</text><text x="810" y="393" text-anchor="middle" class="zh p">浏览器应用</text><text x="810" y="432" text-anchor="middle" class="zh p">覆盖部分基础配置</text></g><line x1="940" y1="395" x2="985" y2="395" class="line"/>
  <g><rect x="995" y="260" width="285" height="270" rx="22" fill="#315EF5"/><text x="1138" y="334" text-anchor="middle" class="mix ih">profile patch</text><text x="1138" y="381" text-anchor="middle" class="zh ip">自己的插件与配置</text><text x="1138" y="425" text-anchor="middle" class="mix ip">cordis.patch.yml</text><text x="1138" y="474" text-anchor="middle" class="zh ip">最常用的定制层</text></g><line x1="1280" y1="395" x2="1325" y2="395" class="line"/>
  <g><rect x="1335" y="285" width="185" height="220" rx="22" fill="#F3F4F6" stroke="#9AA7B8" stroke-width="3"/><text x="1428" y="350" text-anchor="middle" class="mix h">home</text><text x="1428" y="392" text-anchor="middle" class="zh p">全局补丁</text><text x="1428" y="448" text-anchor="middle" class="mix p">--patch</text></g>
  <rect x="100" y="650" width="1400" height="92" rx="20" fill="#EEF2FF"/><text x="800" y="706" text-anchor="middle" class="zh h">每一层都只是补丁：官方能力也能被后续配置替换</text>
</svg>
