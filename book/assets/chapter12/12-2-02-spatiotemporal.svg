<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">时空可组合性</title><desc id="desc">时间可组合性追踪并逆序撤销副作用，空间可组合性根据依赖出现和消失激活或停用组件。</desc>
  <defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#315EF5"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8E99AA"/></marker><style>
    .zh{font-family:SimSun,"Songti SC",serif}.mix{font-family:"Times New Roman",SimSun,"Songti SC",serif}.t{font-size:50px;font-weight:700;fill:#273142}.sub{font-size:25px;fill:#5c667a}.h{font-size:33px;font-weight:700;fill:#273142}.p{font-size:23px;fill:#526071}.ih{font-size:27px;font-weight:700;fill:#fff}.ip{font-size:21px;fill:#fff}.line{stroke:#315EF5;stroke-width:4;fill:none;marker-end:url(#ab)}.back{stroke:#8E99AA;stroke-width:4;stroke-dasharray:12 9;fill:none;marker-end:url(#ag)}</style></defs>
  <rect width="1600" height="900" fill="#fff"/><text x="100" y="92" class="mix t">时空可组合性 · 一个管退出，一个管关系</text><text x="100" y="137" class="zh sub">effects 描述“我改变什么”，coeffects 描述“我需要什么”</text>
  <rect x="100" y="205" width="665" height="510" rx="28" fill="#EEF2FF" stroke="#315EF5" stroke-width="3"/><text x="145" y="268" class="zh h">时间可组合性</text><text x="145" y="307" class="mix p">Temporal · Revertible Effects</text>
  <rect x="155" y="380" width="155" height="105" rx="18" fill="#315EF5"/><text x="233" y="424" text-anchor="middle" class="zh ih">注册工具</text><text x="233" y="459" text-anchor="middle" class="mix ip">effect 1</text><path d="M310 432H370" class="line"/>
  <rect x="380" y="380" width="155" height="105" rx="18" fill="#315EF5"/><text x="458" y="424" text-anchor="middle" class="zh ih">挂监听器</text><text x="458" y="459" text-anchor="middle" class="mix ip">effect 2</text><path d="M535 432H595" class="line"/>
  <rect x="605" y="380" width="105" height="105" rx="18" fill="#F3F4F6" stroke="#9AA7B8" stroke-width="3"/><text x="658" y="444" text-anchor="middle" class="zh p">运行</text><path d="M658 500C658 590 300 590 230 505" class="back"/><text x="445" y="606" text-anchor="middle" class="zh p">disposer 逆序启动</text><text x="445" y="642" text-anchor="middle" class="zh p">异步清理可能重叠</text>
  <rect x="835" y="205" width="665" height="510" rx="28" fill="#F3F4F6" stroke="#9AA7B8" stroke-width="3"/><text x="880" y="268" class="zh h">空间可组合性</text><text x="880" y="307" class="mix p">Spatial · Reactive Coeffects</text>
  <rect x="900" y="380" width="170" height="105" rx="18" fill="#315EF5"/><text x="985" y="424" text-anchor="middle" class="mix ih">Database</text><text x="985" y="459" text-anchor="middle" class="zh ip">提供服务</text><path d="M1070 432H1140" class="line"/>
  <rect x="1150" y="380" width="275" height="105" rx="18" fill="#EEF2FF" stroke="#315EF5" stroke-width="3"/><text x="1288" y="424" text-anchor="middle" class="mix h">User Service</text><text x="1288" y="459" text-anchor="middle" class="mix p">inject: ['database']</text>
  <path d="M985 500V585H1288V500" class="back"/><text x="1135" y="622" text-anchor="middle" class="zh p">依赖消失 · 先停消费者，再撤提供者</text>
  <rect x="100" y="770" width="1400" height="72" rx="18" fill="#315EF5"/><text x="800" y="816" text-anchor="middle" class="zh ih">组件顺序不断变化，系统仍收敛到最终配置决定的稳定状态</text>
</svg>
