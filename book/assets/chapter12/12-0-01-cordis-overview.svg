<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">一图读懂 Cordis</title>
  <desc id="desc">用核心能力、解决的问题、应用场景和未来发展四个维度概括 Cordis。</desc>
  <defs><style>
    .zh{font-family:SimSun,"Songti SC",serif}.mix{font-family:"Times New Roman",SimSun,"Songti SC",serif}
    .t{font-size:52px;font-weight:700;fill:#273142}.sub{font-size:25px;fill:#5c667a}.num{font-size:24px;fill:#315EF5;font-weight:700}
    .h{font-size:32px;font-weight:700;fill:#273142}.p{font-size:25px;fill:#526071}.hi{font-size:32px;font-weight:700;fill:#fff}.hip{font-size:25px;fill:#fff}
  </style></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="100" y="92" class="mix t">一图读懂 Cordis</text>
  <text x="100" y="137" class="zh sub">让运行中的系统安全换零件，无需整机重启</text>
  <rect x="100" y="205" width="665" height="245" rx="26" fill="#315EF5"/>
  <text x="145" y="255" class="mix hip">01 · CORE</text><text x="145" y="313" class="zh hi">核心能力</text>
  <text x="145" y="365" class="zh hip">可撤销副作用 + 响应式依赖</text><text x="145" y="405" class="zh hip">插件可挂载、卸载、替换与重组</text>
  <rect x="835" y="205" width="665" height="245" rx="26" fill="#F3F4F6" stroke="#9AA7B8" stroke-width="3"/>
  <text x="880" y="255" class="mix num">02 · PROBLEM</text><text x="880" y="313" class="zh h">解决的问题</text>
  <text x="880" y="365" class="zh p">卸载不干净、依赖失效、重启丢状态</text><text x="880" y="405" class="zh p">进程级治理与模块级变化不匹配</text>
  <rect x="100" y="510" width="665" height="245" rx="26" fill="#EEF2FF" stroke="#315EF5" stroke-width="3"/>
  <text x="145" y="560" class="mix num">03 · SCENARIO</text><text x="145" y="618" class="zh h">应用场景</text>
  <text x="145" y="670" class="zh p">模型、工具、沙箱、子 Agent、界面</text><text x="145" y="710" class="zh p">按任务组合，同一接口替换实现</text>
  <rect x="835" y="510" width="665" height="245" rx="26" fill="#F3F4F6" stroke="#9AA7B8" stroke-width="3"/>
  <text x="880" y="560" class="mix num">04 · FUTURE</text><text x="880" y="618" class="zh h">未来发展</text>
  <text x="880" y="670" class="zh p">从人装插件，走向 Agent 修改自身 harness</text><text x="880" y="710" class="zh p">仍需验证安全、兼容、成本与治理</text>
  <text x="100" y="838" class="zh sub">关键词 · 时空可组合性（Spatiotemporal Composability）</text>
</svg>
