<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cordis 的六个核心组成</title>
  <desc id="desc">插件、Loader、Fiber、服务与依赖、事件、Effect 共同构成 Cordis 运行时。</desc>
  <defs><style>.zh{font-family:SimSun,"Songti SC",serif}.mix{font-family:"Times New Roman",SimSun,"Songti SC",serif}.t{font-size:50px;font-weight:700;fill:#273142}.sub{font-size:25px;fill:#5c667a}.n{font-size:23px;font-weight:700;fill:#315EF5}.h{font-size:28px;font-weight:700;fill:#273142}.p{font-size:21px;fill:#526071}.ih{font-size:28px;font-weight:700;fill:#fff}.ip{font-size:21px;fill:#fff}</style></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="100" y="92" class="mix t">Cordis 的六个核心组成</text>
  <text x="100" y="137" class="zh sub">从模块定义走到运行实例，再由依赖、事件与 effect 维持关系</text>

  <g><rect x="100" y="215" width="420" height="210" rx="24" fill="#EEF2FF" stroke="#315EF5" stroke-width="3"/><text x="140" y="265" class="mix n">01</text><text x="190" y="265" class="zh h">插件</text><text x="140" y="322" class="zh p">函数 · 带 apply 的对象</text><text x="140" y="365" class="mix p">Service 子类</text><text x="140" y="400" class="zh p">描述自己贡献的能力</text></g>
  <g><rect x="590" y="215" width="420" height="210" rx="24" fill="#315EF5"/><text x="630" y="265" class="mix ip">02</text><text x="680" y="265" class="mix ih">Loader</text><text x="630" y="322" class="mix ip">cordis.yml / overlay</text><text x="630" y="365" class="zh ip">解析模块并发挂载</text><text x="630" y="400" class="zh ip">配置顺序不等于依赖顺序</text></g>
  <g><rect x="1080" y="215" width="420" height="210" rx="24" fill="#F3F4F6" stroke="#9AA7B8" stroke-width="3"/><text x="1120" y="265" class="mix n">03</text><text x="1170" y="265" class="mix h">Fiber</text><text x="1120" y="322" class="mix p">PENDING → ACTIVE</text><text x="1120" y="365" class="mix p">FAILED / DISPOSED</text><text x="1120" y="400" class="zh p">一个插件实例的运行句柄</text></g>

  <g><rect x="100" y="505" width="420" height="210" rx="24" fill="#F3F4F6" stroke="#9AA7B8" stroke-width="3"/><text x="140" y="555" class="mix n">04</text><text x="190" y="555" class="zh h">服务与依赖</text><text x="140" y="612" class="mix p">ctx.&lt;key&gt; · inject</text><text x="140" y="655" class="zh p">服务就绪才激活消费者</text><text x="140" y="690" class="zh p">依赖变化触发重新加载</text></g>
  <g><rect x="590" y="505" width="420" height="210" rx="24" fill="#EEF2FF" stroke="#315EF5" stroke-width="3"/><text x="630" y="555" class="mix n">05</text><text x="680" y="555" class="zh h">类型化事件</text><text x="630" y="612" class="mix p">emit · parallel · serial</text><text x="630" y="655" class="mix p">bail · waterfall</text><text x="630" y="690" class="zh p">广播、等待或短路决策</text></g>
  <g><rect x="1080" y="505" width="420" height="210" rx="24" fill="#315EF5"/><text x="1120" y="555" class="mix ip">06</text><text x="1170" y="555" class="mix ih">Effect</text><text x="1120" y="612" class="mix ip">ctx.effect() / ctx.on()</text><text x="1120" y="655" class="zh ip">记录资源与 disposer</text><text x="1120" y="690" class="zh ip">卸载时自动撤销</text></g>

  <text x="800" y="815" text-anchor="middle" class="zh sub">DSH 的模型、工具与循环都沿这条链进入运行时</text>
</svg>
