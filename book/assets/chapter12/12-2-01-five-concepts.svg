<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cordis 的五个核心概念</title><desc id="desc">插件、上下文、依赖、事件与可逆副作用构成 Cordis 的核心。</desc>
  <defs><style>.zh{font-family:SimSun,"Songti SC",serif}.mix{font-family:"Times New Roman",SimSun,"Songti SC",serif}.t{font-size:50px;font-weight:700;fill:#273142}.sub{font-size:25px;fill:#5c667a}.n{font-size:25px;font-weight:700;fill:#315EF5}.h{font-size:29px;font-weight:700;fill:#273142}.p{font-size:22px;fill:#526071}.ih{font-size:29px;font-weight:700;fill:#fff}.ip{font-size:22px;fill:#fff}</style></defs>
  <rect width="1600" height="900" fill="#fff"/><text x="100" y="92" class="mix t">Cordis 的五个核心概念</text><text x="100" y="137" class="zh sub">一个插件只需说明：我是谁、需要什么、做了什么、如何撤销</text>
  <g><rect x="100" y="230" width="420" height="190" rx="24" fill="#EEF2FF" stroke="#315EF5" stroke-width="3"/><text x="140" y="280" class="mix n">01</text><text x="190" y="280" class="zh h">插件</text><text x="140" y="335" class="zh p">用 apply(ctx) 贡献能力</text><text x="140" y="375" class="zh p">函数或 Service 子类都可以</text></g>
  <g><rect x="590" y="230" width="420" height="190" rx="24" fill="#315EF5"/><text x="630" y="280" class="mix ip">02</text><text x="680" y="280" class="zh ih">上下文</text><text x="630" y="335" class="zh ip">稳定的 ctx.&lt;key&gt; 服务容器</text><text x="630" y="375" class="zh ip">消费者不导入具体实现</text></g>
  <g><rect x="1080" y="230" width="420" height="190" rx="24" fill="#F3F4F6" stroke="#9AA7B8" stroke-width="3"/><text x="1120" y="280" class="mix n">03</text><text x="1170" y="280" class="zh h">依赖</text><text x="1120" y="335" class="mix p">inject: ['theme']</text><text x="1120" y="375" class="zh p">服务就绪才启动</text></g>
  <g><rect x="345" y="500" width="420" height="190" rx="24" fill="#F3F4F6" stroke="#9AA7B8" stroke-width="3"/><text x="385" y="550" class="mix n">04</text><text x="435" y="550" class="zh h">类型化事件</text><text x="385" y="605" class="mix p">emit · waterfall</text><text x="385" y="645" class="mix p">parallel · serial</text></g>
  <g><rect x="835" y="500" width="420" height="190" rx="24" fill="#EEF2FF" stroke="#315EF5" stroke-width="3"/><text x="875" y="550" class="mix n">05</text><text x="925" y="550" class="zh h">可逆副作用</text><text x="875" y="605" class="mix p">ctx.effect() / ctx.on()</text><text x="875" y="645" class="zh p">卸载时按账本撤销</text></g>
  <text x="800" y="802" text-anchor="middle" class="zh sub">Cordis 管生命周期；真正的 Agent 能力由插件提供。</text>
</svg>
