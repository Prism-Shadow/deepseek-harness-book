<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">官方最小插件从配置到输出</title>
  <desc id="desc">hello.ts 与 cordis.yml 由 Loader 解析并挂载为 fiber，Cordis 调用 apply 后输出一行文本。</desc>
  <defs>
    <style>
      .zh{font-family:"Songti SC","SimSun",serif;fill:#273142}.mix{font-family:"Times New Roman","Songti SC",serif;fill:#273142}.t{font-size:52px;font-weight:700}.sub{font-size:25px;fill:#657184}.h{font-size:31px;font-weight:700}.p{font-size:24px}.code{font-family:"SFMono-Regular","Menlo",monospace;font-size:22px}.ih{font-size:31px;font-weight:700;fill:#fff}.ip{font-size:24px;fill:#fff}.line{stroke:#315EF5;stroke-width:5;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315EF5"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="100" y="92" class="mix t">官方最小插件怎样跑起来</text>
  <text x="100" y="137" class="zh sub">DeepSeek Harness master 99f6f02f · 实际运行结果</text>

  <rect x="100" y="225" width="430" height="250" rx="24" fill="#F3F4F6" stroke="#9AA7B8" stroke-width="3"/>
  <text x="140" y="280" class="mix h">hello.ts</text>
  <text x="140" y="340" class="mix code">export const name = 'hello'</text>
  <text x="140" y="392" class="mix code">export function apply(ctx) {</text>
  <text x="175" y="434" class="mix code">console.log(...)</text>
  <text x="140" y="464" class="mix code">}</text>

  <rect x="100" y="545" width="430" height="150" rx="24" fill="#EEF2FF" stroke="#315EF5" stroke-width="3"/>
  <text x="140" y="600" class="mix h">cordis.yml</text>
  <text x="140" y="653" class="mix code">- name: './hello.ts'</text>

  <path d="M530 350H660" class="line"/>
  <path d="M530 620H600Q640 620 640 570V470Q640 430 680 430" class="line"/>

  <rect x="680" y="285" width="360" height="300" rx="28" fill="#315EF5"/>
  <text x="860" y="352" text-anchor="middle" class="mix ih">Root Context + Loader</text>
  <text x="860" y="418" text-anchor="middle" class="zh ip">读取配置并解析模块</text>
  <text x="860" y="468" text-anchor="middle" class="zh ip">挂载为一个 fiber</text>
  <text x="860" y="518" text-anchor="middle" class="mix ip">Cordis 调用 apply(ctx)</text>

  <path d="M1040 435H1160" class="line"/>

  <rect x="1180" y="285" width="320" height="300" rx="28" fill="#111827"/>
  <circle cx="1220" cy="325" r="8" fill="#EF4444"/>
  <circle cx="1245" cy="325" r="8" fill="#F59E0B"/>
  <circle cx="1270" cy="325" r="8" fill="#10B981"/>
  <text x="1220" y="395" class="code" fill="#D1D5DB">$ node --import tsx ...</text>
  <text x="1220" y="462" class="code" fill="#fff">hello from my</text>
  <text x="1220" y="500" class="code" fill="#fff">first plugin</text>
  <text x="1220" y="548" class="code" fill="#9CA3AF">exit 0</text>

  <rect x="100" y="770" width="1400" height="72" rx="18" fill="#EEF2FF"/>
  <text x="800" y="816" text-anchor="middle" class="zh p">插件描述贡献，配置选择插件，依赖关系决定启动时机</text>
</svg>
