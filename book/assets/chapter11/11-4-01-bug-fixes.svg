  <rect width="1600" height="900" fill="#FFFFFF"/>

  <path d="M470 285 H535 Q555 285 555 305 V400 Q555 420 575 420 H615" fill="none" stroke="#253A9B" stroke-width="4" marker-end="url(#arrow-blue)"/>
