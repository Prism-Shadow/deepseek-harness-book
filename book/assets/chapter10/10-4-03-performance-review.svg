<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#315EF5"/>
    </marker>
    <style>
      .cn { font-family: SimSun, "Songti SC", serif; fill: #273142; }
      .en { font-family: "Times New Roman", serif; }
      .title { font-size: 52px; font-weight: 700; }
      .node-title { font-size: 32px; font-weight: 700; }
      .metric { font-size: 46px; font-weight: 700; }
      .desc { font-size: 24px; }
      .white { fill: #FFFFFF; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <text x="100" y="108" class="cn title">性能变化与待测位置</text>
  <rect x="100" y="136" width="108" height="6" rx="3" fill="#315EF5"/>

  <g>
    <rect x="100" y="220" width="540" height="340" rx="26" fill="#315EF5"/>
    <text x="370" y="292" text-anchor="middle" class="cn node-title white">代码高亮明显变轻</text>
    <line x1="180" y1="326" x2="560" y2="326" stroke="#FFFFFF" stroke-width="2" opacity="0.55"/>
    <text x="370" y="400" text-anchor="middle" class="en metric white">308 KB → 69 KB</text>
    <text x="370" y="474" text-anchor="middle" class="en metric white">11 MB → 3.3 MB</text>
    <text x="370" y="528" text-anchor="middle" class="cn desc white">数据来自 #300 提交记录</text>
  </g>

  <path d="M670 390 H770" fill="none" stroke="#315EF5" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <g>
    <rect x="820" y="270" width="680" height="240" rx="26" fill="#EEF2FF" stroke="#315EF5" stroke-width="3"/>
    <text x="1160" y="365" text-anchor="middle" class="cn node-title">首次打开代码块更快</text>
    <text x="1160" y="425" text-anchor="middle" class="cn desc">本次没有重新测量</text>
  </g>

  <path d="M1090 530 V600" fill="none" stroke="#64748B" stroke-width="3" stroke-dasharray="10 10"/>
  <rect x="970" y="560" width="240" height="70" rx="35" fill="#315EF5"/>
  <text x="1090" y="606" text-anchor="middle" class="cn desc white">仍需压测</text>
  <path d="M1090 630 V660 H950 V690" fill="none" stroke="#64748B" stroke-width="3" stroke-dasharray="10 10"/>
  <path d="M1090 660 H1300 V690" fill="none" stroke="#64748B" stroke-width="3" stroke-dasharray="10 10"/>

  <g>
    <rect x="760" y="690" width="380" height="130" rx="22" fill="#F3F4F6" stroke="#9AA7B8" stroke-width="3"/>
    <text x="950" y="742" text-anchor="middle" class="cn node-title">长期扫描</text>
    <text x="950" y="786" text-anchor="middle" class="cn desc">日期目录越积越多</text>
  </g>
  <g>
    <rect x="1190" y="690" width="310" height="130" rx="22" fill="#F3F4F6" stroke="#9AA7B8" stroke-width="3"/>
    <text x="1345" y="742" text-anchor="middle" class="cn node-title">多人上传</text>
    <text x="1345" y="786" text-anchor="middle" class="cn desc">内存与响应时间</text>
  </g>
</svg>
