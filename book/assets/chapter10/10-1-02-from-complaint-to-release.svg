<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#315EF5"/>
    </marker>
    <style>
      .zh { font-family: "Songti SC", SimSun, serif; fill: #273142; }
      .en { font-family: "Times New Roman", serif; fill: #667085; }
      .title { font-size: 48px; font-weight: 700; }
      .node { font-size: 30px; font-weight: 700; }
      .small { font-size: 23px; }
      .label { font-size: 22px; font-weight: 700; fill: #315EF5; }
      .zh.inverse, .en.inverse { fill: #FFFFFF; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="90" y="105" class="zh title">从一条用户吐槽到可验证交付</text>
  <text x="92" y="150" class="en small">An AI-native product team turns intent into tested change.</text>

  <g>
    <rect x="90" y="230" width="290" height="170" rx="26" fill="#EEF2FF" stroke="#315EF5" stroke-width="3"/>
    <text x="235" y="295" text-anchor="middle" class="zh node">用户吐槽</text>
    <text x="235" y="342" text-anchor="middle" class="zh small">“阻塞了，却看不出</text>
    <text x="235" y="376" text-anchor="middle" class="zh small">在等谁”</text>

    <rect x="475" y="230" width="290" height="170" rx="26" fill="#F3F4F6" stroke="#9AA7B8" stroke-width="3"/>
    <text x="620" y="295" text-anchor="middle" class="zh node">显式任务</text>
    <text x="620" y="342" text-anchor="middle" class="zh small">验收标准</text>
    <text x="620" y="376" text-anchor="middle" class="zh small">依赖关系</text>

    <rect x="860" y="230" width="290" height="170" rx="26" fill="#EEF2FF" stroke="#315EF5" stroke-width="3"/>
    <text x="1005" y="295" text-anchor="middle" class="zh node">AI 研发团队</text>
    <text x="1005" y="342" text-anchor="middle" class="zh small">并行调研 · 顺序交付</text>
    <text x="1005" y="376" text-anchor="middle" class="zh small">安全接管</text>

    <rect x="1245" y="230" width="265" height="170" rx="26" fill="#315EF5" stroke="#2148CC" stroke-width="3"/>
    <text x="1378" y="295" text-anchor="middle" class="zh node inverse">功能上线</text>
    <text x="1378" y="342" text-anchor="middle" class="zh small inverse">代码可查</text>
    <text x="1378" y="376" text-anchor="middle" class="zh small inverse">测试可复现</text>

    <path d="M380 315 H455" stroke="#315EF5" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M765 315 H840" stroke="#315EF5" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M1150 315 H1225" stroke="#315EF5" stroke-width="5" marker-end="url(#arrow)"/>
  </g>

  <g>
    <rect x="90" y="515" width="440" height="250" rx="24" fill="#FFFFFF" stroke="#9AA7B8" stroke-width="3"/>
    <text x="125" y="575" class="zh label">要做什么</text>
    <text x="125" y="632" class="zh node">补全阻塞原因</text>
    <text x="125" y="682" class="zh small">让卡片显示未完成的</text>
    <text x="125" y="718" class="zh small">前置任务编号与名称</text>

    <rect x="580" y="515" width="440" height="250" rx="24" fill="#EEF2FF" stroke="#315EF5" stroke-width="3"/>
    <text x="615" y="575" class="zh label">实现效果</text>
    <text x="615" y="632" class="zh node">从模糊状态到可行动</text>
    <text x="615" y="682" class="zh small">负责人知道下一步</text>
    <text x="615" y="718" class="zh small">测试知道如何验收</text>

    <rect x="1070" y="515" width="440" height="250" rx="24" fill="#F3F4F6" stroke="#9AA7B8" stroke-width="3"/>
    <text x="1105" y="575" class="zh label">解决场景</text>
    <text x="1105" y="632" class="zh node">小团队多角色协作</text>
    <text x="1105" y="682" class="zh small">一个人提出目标</text>
    <text x="1105" y="718" class="zh small">多个 Agent 推进交付</text>
  </g>
</svg>
