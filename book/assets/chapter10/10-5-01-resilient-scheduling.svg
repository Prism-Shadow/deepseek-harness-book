<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#315EF5"/>
    </marker>
    <style>
      .zh { font-family: "Songti SC", SimSun, serif; fill: #273142; }
      .en { font-family: "Times New Roman", serif; fill: #667085; }
      .title { font-size: 48px; font-weight: 700; }
      .node { font-size: 29px; font-weight: 700; }
      .small { font-size: 22px; }
      .tag { font-size: 20px; font-weight: 700; }
      .zh.inverse, .en.inverse { fill: #FFFFFF; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="90" y="105" class="zh title">中断之后，任务如何安全继续</text>
  <text x="92" y="150" class="en small">Resilient scheduling prevents concurrent takeover.</text>

  <g>
    <rect x="80" y="270" width="280" height="190" rx="24" fill="#EEF2FF" stroke="#315EF5" stroke-width="3"/>
    <text x="115" y="320" class="en tag">attempt 1</text>
    <text x="220" y="378" text-anchor="middle" class="zh node">开发成员执行</text>
    <text x="220" y="420" text-anchor="middle" class="zh small">任务已认领</text>

    <rect x="470" y="270" width="280" height="190" rx="24" fill="#F3F4F6" stroke="#9AA7B8" stroke-width="3" stroke-dasharray="12 10"/>
    <text x="505" y="320" class="en tag">interrupted</text>
    <text x="610" y="378" text-anchor="middle" class="zh node">执行未及时落地</text>
    <text x="610" y="420" text-anchor="middle" class="zh small">任务仍未完成</text>

    <rect x="860" y="270" width="280" height="190" rx="24" fill="#F3F4F6" stroke="#315EF5" stroke-width="3"/>
    <text x="895" y="320" class="en tag">reassign</text>
    <text x="1000" y="378" text-anchor="middle" class="zh node">撤销旧尝试</text>
    <text x="1000" y="420" text-anchor="middle" class="zh small">等待旧成员停止</text>

    <rect x="1250" y="270" width="280" height="190" rx="24" fill="#315EF5" stroke="#2148CC" stroke-width="3"/>
    <text x="1285" y="320" class="en tag inverse">attempt 2</text>
    <text x="1390" y="378" text-anchor="middle" class="zh node inverse">队长接管完成</text>
    <text x="1390" y="420" text-anchor="middle" class="zh small inverse">新尝试独占写入</text>

    <path d="M360 365 H450" stroke="#315EF5" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M750 365 H840" stroke="#315EF5" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M1140 365 H1230" stroke="#315EF5" stroke-width="5" marker-end="url(#arrow)"/>
  </g>

  <g>
    <rect x="175" y="590" width="500" height="165" rx="24" fill="#FFFFFF" stroke="#9AA7B8" stroke-width="3"/>
    <text x="215" y="642" class="zh node">磁盘状态是真相源</text>
    <text x="215" y="692" class="en small">.agent-teams/archive/.../team.json</text>
    <text x="215" y="728" class="zh small">成员、依赖、尝试次数均可追踪</text>

    <rect x="925" y="590" width="500" height="165" rx="24" fill="#EEF2FF" stroke="#315EF5" stroke-width="3"/>
    <text x="965" y="642" class="zh node">下游任务自动就绪</text>
    <text x="965" y="692" class="zh small">开发完成后，测试成员认领任务</text>
    <text x="965" y="728" class="zh small">最终测试全部通过</text>

    <path d="M675 672 H905" stroke="#315EF5" stroke-width="5" marker-end="url(#arrow)"/>
  </g>
</svg>
