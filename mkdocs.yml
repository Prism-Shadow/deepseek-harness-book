site_name: dsh 中文实战书
site_description: dsh 中文实战书稿：从基础使用到 Harness、Cordis 与插件扩展
site_url: https://dshbook.penguin.ooo/
repo_name: Prism-Shadow/dsh-book
repo_url: https://github.com/Prism-Shadow/dsh-book
edit_uri: edit/main/book/
copyright: 从零开始玩转 DeepSeek Harness

extra:
  book_title: 从零开始玩转 DeepSeek Harness
  generator: false

docs_dir: output/site-src
site_dir: output/site
strict: true

theme:
  name: material
  language: zh
  custom_dir: site/overrides
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light-blue
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/drawer-scroll-lock.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - 开始阅读: index.md
  - 第一部分　玩转 dsh:
      - 第1章　初识 dsh: chapter1.md
      - 第2章　定制自己的 dsh: chapter2.md
      - 第3章　让 dsh 完成一次调研: chapter3.md
      - 第4章　用 dsh 完成日常办公: chapter4.md
      - 第5章　让 dsh 成为飞书里的数字秘书: chapter5.md
      - 第6章　让 dsh 设计活动海报: chapter6.md
      - 第7章　让 dsh 制作短剧: chapter7.md
      - 第8章　让 dsh 帮你找工作: chapter8.md
      - 第9章　用 dsh 构建市场投研助手: chapter9.md
      - 第10章　用 dsh 和 AgentTeams 组建 OPC 代码审查团队: chapter10.md
  - 第二部分　扩展 dsh:
      - 第11章　扩展 dsh 的能力: chapter11.md
      - 第12章　让 dsh 通过自进化画出概念图: chapter12.md
  - 第三部分　拆解 dsh:
      - 第13章　Harness 的工作原理: chapter13.md
      - 第14章　dsh 的核心：Cordis: chapter14.md
